
name: Source probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check TSETMC
        continue-on-error: true
        run: |
          mkdir -p probe-report
          echo "Checking TSETMC"
          curl -L -sS --connect-timeout 10 --max-time 30 \
            -o /tmp/tsetmc.html \
            -w "TSETMC HTTP: %{http_code}\n" \
            https://www.tsetmc.com/ \
            > probe-report/tsetmc.txt 2>&1
          echo "curl_exit=$?" >> probe-report/tsetmc.txt

      - name: Check Codal
        continue-on-error: true
        run: |
          echo "Checking Codal"
          curl -L -sS --connect-timeout 10 --max-time 30 \
            -o /tmp/codal.html \
            -w "Codal HTTP: %{http_code}\n" \
            https://codal.ir/ \
            > probe-report/codal.txt 2>&1
          echo "curl_exit=$?" >> probe-report/codal.txt

      - name: Create report
        if: always()
        run: |
          {
            echo "# Source Probe Report"
            echo ""
            echo "## TSETMC"
            cat probe-report/tsetmc.txt 2>/dev/null || true
            echo ""
            echo "## Codal"
            cat probe-report/codal.txt 2>/dev/null || true
          } > probe-report/report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: probe-report/
