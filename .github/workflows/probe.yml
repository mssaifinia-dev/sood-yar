
name: Source probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check TSETMC
        run: |
          echo "Checking TSETMC"
          curl -L -sS --max-time 20 -o /tmp/tsetmc.html -w "TSETMC HTTP: %{http_code}\n" https://www.tsetmc.com/

      - name: Check Codal
        run: |
          echo "Checking Codal"
          curl -L -sS --max-time 20 -o /tmp/codal.html -w "Codal HTTP: %{http_code}\n" https://codal.ir/

      - name: Create report
        if: always()
        run: |
          mkdir -p probe-report
          {
            echo "# Source Probe Report"
            echo ""
            echo "Tested from GitHub Actions."
            echo ""
            echo "TSETMC and Codal HTTP checks were executed in previous steps."
          } > probe-report/report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: probe-report/report.md
